name: Build QMK Firmware

on:
  push:
    branches: [ main, master, yamaryu211 ]
  pull_request:
    branches: [ main, master, yamaryu211 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli:latest  # QMK公式の最新コンテナ環境
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Compile Keyball61
      run: |
        # 1. QMK公式環境の初期化（これにより公式データが /qmk_firmware に展開されます）
        qmk setup -y

        # 2. あなたのリポジトリにある keyball61 フォルダを公式の keyboards 配下へ強制的にコピー（上書き）します
        mkdir -p /qmk_firmware/keyboards/keyball
        cp -R $GITHUB_WORKSPACE/qmk_firmware/keyboards/keyball/keyball61 /qmk_firmware/keyboards/keyball/

        # 3. コピーが正しく行われたかフォルダの中身を確認（デバッグ用）
        echo "=== コピー先のフォルダ確認 ==="
        ls -la /qmk_firmware/keyboards/keyball/keyball61

        # 4. QMK公式環境のディレクトリに移動
        cd /qmk_firmware

        # 5. ProMicro RP2040向けのコンパイルを実行
        qmk compile -kb keyball/keyball61 -km default -e MCU=RP2040 -e BOOTLOADER=rp2040

        # 6. 生成されたファームウェア（.uf2）を抽出して集約
        mkdir -p /tmp/artifacts
        find .build -name "*.uf2" 2>/dev/null | xargs -I {} cp {} /tmp/artifacts/ || true

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Keyball61_RP2040_Firmware
        path: /tmp/artifacts/
