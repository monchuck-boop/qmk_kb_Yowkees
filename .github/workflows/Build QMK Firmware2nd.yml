name: Build QMK Firmware

on:
  push:
    branches: [ main, master, yamaryu211 ]
  pull_request:
    branches: [ main, master, yamaryu211 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli:latest  # QMK公式の最新コンテナ環境
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive  # あなたのリポジトリにある「qmk_firmware」の中身をすべて読み込みます

    - name: Compile Keyball61
      run: |
        # 1. QMK公式環境の初期化
        qmk setup -y

        # 2. あなたのリポジトリの「qmk_firmware」がある場所に移動
        cd qmk_firmware

        # 3. ProMicro RP2040向けのコンパイルを実行
        qmk compile -kb keyball/keyball61 -km default -e MCU=RP2040 -e BOOTLOADER=rp2040

        # 4. 生成されたファームウェア（.uf2）を抽出して集約
        mkdir -p /tmp/artifacts
        find .build -name "*.uf2" 2>/dev/null | xargs -I {} cp {} /tmp/artifacts/ || true

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Keyball61_RP2040_Firmware
        path: /tmp/artifacts/
