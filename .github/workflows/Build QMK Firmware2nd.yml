name: Build QMK Firmware

on:
  push:
    branches: [ main, master, yamaryu211 ]
  pull_request:
    branches: [ main, master, yamaryu211 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli:latest  # QMK公式の最新コンテナ環境
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Compile Keyball61 from Repository Path
      run: |
        # 1. QMK公式環境の初期化
        qmk setup -y

        # 2. 公式のkeyboards/keyballフォルダを作成
        mkdir -p /qmk_firmware/keyboards/keyball

        # 3. リポジトリの直下にある各キーボードフォルダを、公式のkeyballフォルダの中へコピー
        # （存在するフォルダのみ安全にコピーします）
        [ -d "./keyball39" ] && cp -R ./keyball39 /qmk_firmware/keyboards/keyball/ || true
        [ -d "./keyball44" ] && cp -R ./keyball44 /qmk_firmware/keyboards/keyball/ || true
        [ -d "./keyball46" ] && cp -R ./keyball46 /qmk_firmware/keyboards/keyball/ || true
        [ -d "./keyball61" ] && cp -R ./keyball61 /qmk_firmware/keyboards/keyball/ || true
        [ -d "./keyballplus" ] && cp -R ./keyballplus /qmk_firmware/keyboards/keyball/ || true
        [ -d "./Keybit8" ] && cp -R ./Keybit8 /qmk_firmware/keyboards/keyball/ || true

        # 4. QMKのディレクトリに移動し、キャッシュを更新
        cd /qmk_firmware
        qmk list-keyboards -c > /dev/null 2>&1 || echo "Cache synced"

        # 5. ProMicro RP2040向けのコンパイルを実行
        qmk compile -kb keyball/keyball61 -km default -e MCU=RP2040 -e BOOTLOADER=rp2040

        # 6. 生成されたファームウェア（.uf2）の抽出
        mkdir -p /tmp/artifacts
        find /qmk_firmware/.build -name "*.uf2" 2>/dev/null | xargs -I {} cp {} /tmp/artifacts/ || true

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Keyball61_RP2040_Firmware
        path: /tmp/artifacts/
