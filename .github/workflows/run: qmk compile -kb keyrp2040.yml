name: Build QMK Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi

    - name: Rebuild QMK Environment
      run: |
        # 既存の不完全な qmk_firmware フォルダを削除し、
        # 正しい Keyball 対応ファームウェアベースを Actions 上に新しくダウンロードします
        rm -rf qmk_firmware
        git clone --depth=1 --recursive "https://github.com" qmk_firmware

    - name: Deploy Keyball61 Source
      run: |
        # 最新のQMK構造（keyboards/keyball/keyball61）を作成し、
        # あなたのリポジトリにあるソースファイルを正しく配置します
        mkdir -p qmk_firmware/keyboards/keyball/keyball61
        cp -R keyball61/. qmk_firmware/keyboards/keyball/keyball61/

    - name: Compile Keyball61 (RP2040)
      run: |
        cd qmk_firmware
        # 正しく構築された環境で ProMicro RP2040 (Vial対応) のビルドを実行します
        make keyball/keyball61:default MCU=RP2040 BOOTLOADER=rp2040

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Keyball61_RP2040_Firmware
        path: |
          qmk_firmware/*.uf2
          qmk_firmware/*.bin
          qmk_firmware/.build/*.uf2
          qmk_firmware/.build/*.bin
