name: Build QMK Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli:latest
    steps:
    - name: Checkout repository from main branch
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Force Smart Deploy and Compile Keyball61 (RP2040)
      run: |
        # QMK公式環境の初期化
        qmk setup -y
        
        # 確実にプログラムが存在するフォルダをリポジトリ内から特定
        REAL_PATH=$(find . -type f -name "info.json" | grep "keyball61" | head -n 1 | xargs dirname)
        if [ -z "$REAL_PATH" ]; then
          REAL_PATH=$(find . -type f -name "info.json" | head -n 1 | xargs dirname)
        fi
        
        # QMK公式の keyboards フォルダの配下に直接上書きコピー
        mkdir -p /qmk_firmware/keyboards/keyball/keyball61
        cp -R ${REAL_PATH}/. /qmk_firmware/keyboards/keyball/keyball61/
        
        # 【最重要】新しく追加したKeyball61のソースコードをQMKシステムに完全に認識・登録させます
        cd /qmk_firmware
        qmk find -kb keyball/keyball61 || echo "Scanning..."
        
        # 確実にデータベースに登録された状態で、ProMicro RP2040用コンパイルを実行します
        qmk compile -kb keyball/keyball61 -km default -e MCU=RP2040 -e BOOTLOADER=rp2040

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Keyball61_RP2040_Firmware
        path: |
          /qmk_firmware/*.uf2
          /qmk_firmware/*.bin
          /qmk_firmware/.build/*.uf2
          /qmk_firmware/.build/*.bin
