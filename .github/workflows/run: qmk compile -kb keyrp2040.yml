name: Build QMK Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli:latest
    steps:
    - name: Checkout repository from main branch
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Force Smart Deploy and Compile Keyball61 (RP2040)
      run: |
        # QMK公式環境の初期化
        qmk setup -y
        
        # 既存の紛らわしい壊れたqmk_firmwareフォルダによる誤検出を防ぐため、探索から完全に除外します
        # ルート直下にある本物の「keyball61」設定フォルダ（info.jsonがある場所）だけをピンポイントで特定します
        REAL_PATH=$(find . -maxdepth 2 -type f -name "info.json" | grep "keyball61" | head -n 1 | xargs dirname)
        
        if [ -z "$REAL_PATH" ]; then
          # 万が一親フォルダが挟まっていた場合のフォールバック
          REAL_PATH="./keyball/keyball61"
        fi
        
        echo "本物のソースコードをここから取得します: $REAL_PATH"
        
        # QMK公式が100%認識できる標準ネスト構造（keyboards/keyball/keyball61）を強制展開
        mkdir -p /qmk_firmware/keyboards/keyball/keyball61
        cp -R ${REAL_PATH}/. /qmk_firmware/keyboards/keyball/keyball61/
        
        # コピー完了後に本物のファイル群が配置されたかログで物理的に証明します
        echo "=== 配置完了後の QMK内部のファイル一覧 ==="
        ls -la /qmk_firmware/keyboards/keyball/keyball61/
        
        # QMK CLIツールのバグをすり抜け、内部のmakeシステムを直接実行してコンパイルさせます
        cd /qmk_firmware
        make keyball/keyball61:default MCU=RP2040 BOOTLOADER=rp2040

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Keyball61_RP2040_Firmware
        path: |
          /qmk_firmware/.build/*.uf2
          /qmk_firmware/.build/*.bin
          /qmk_firmware/*.uf2
