name: Build QMK Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli:latest  # QMK公式の最新ビルド環境をコンテナとして直接使用します
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Compile Keyball61 (RP2040)
      run: |
        # QMK公式の最新ソースコードをコンテナ内に確実にセットアップします
        qmk setup -y
        
        # あなたのリポジトリにある「keyball」フォルダ（親フォルダごと）を
        # QMK公式の keyboards/ 直下に完全に適合するように正しく上書きコピーします
        cp -R keyball /qmk_firmware/keyboards/
        
        # 正しいパス構造（keyboards/keyball/keyball61）に配置されたため、ビルドが正常に開始されます
        cd /qmk_firmware
        qmk compile -kb keyball/keyball61 -km default -e MCU=RP2040 -e BOOTLOADER=rp2040

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Keyball61_RP2040_Firmware
        path: |
          /qmk_firmware/*.uf2
          /qmk_firmware/*.bin
          /qmk_firmware/.build/*.uf2
          /qmk_firmware/.build/*.bin
