name: Build QMK Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi

    - name: Force Deploy Keyball61 Source
      run: |
        # 同梱されているQMKファームウェア内の可能性のある2つの場所に、
        # あなたの keyball61 フォルダの中身を強制的に両方ともコピー（配置）します。
        
        # パターン1: keyboards/keyball61/
        mkdir -p qmk_firmware/keyboards/keyball61
        cp -R keyball61/. qmk_firmware/keyboards/keyball61/
        
        # パターン2: keyboards/keyball/keyball61/
        mkdir -p qmk_firmware/keyboards/keyball/keyball61
        cp -R keyball61/. qmk_firmware/keyboards/keyball/keyball61/

    - name: Compile Keyball61 (RP2040)
      run: |
        cd qmk_firmware
        
        # どちらのターゲット名が正解でも通るように、順番にビルドを試みます。
        # 1つ目が失敗しても、2つ目が成功すればワークフローは成功します。
        make keyball/keyball61:default MCU=RP2040 BOOTLOADER=rp2040 || make keyball61:default MCU=RP2040 BOOTLOADER=rp2040

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Keyball61_RP2040_Firmware
        path: |
          qmk_firmware/*.uf2
          qmk_firmware/*.bin
          qmk_firmware/.build/*.uf2
          qmk_firmware/.build/*.bin
