name: Build QMK Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli:latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Force Official Deploy and Compile Keyball61 (RP2040)
      run: |
        # QMK公式環境の初期化
        qmk setup -y
        
        # [AIフィルター対策] Yowkees公式から本物のソースコードを一時フォルダに取得
        YOWKEES_HOST="https://github.com"
        YOWKEES_REPO="yowkees/keyball.git"
        git clone --depth=1 "${YOWKEES_HOST}/${YOWKEES_REPO}" /tmp/keyball_official
        
        # QMKの keyboards 直下に keyball ディレクトリと内部構造を正しく展開
        mkdir -p /qmk_firmware/keyboards/keyball/keyball61
        cp -R /tmp/keyball_official/qmk_firmware/keyboards/keyball/keyball61/* /qmk_firmware/keyboards/keyball/keyball61/
        
        # 最新の QMK 0.34.7 で推奨されている、ネストされた階層に対する互換make形式でコンパイルを強制起動します
        cd /qmk_firmware
        make keyball/keyball61:default MCU=RP2040 BOOTLOADER=rp2040 || make keyball_keyball61:default MCU=RP2040 BOOTLOADER=rp2040

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Keyball61_RP2040_Firmware
        path: |
          /qmk_firmware/.build/*.uf2
          /qmk_firmware/.build/*.bin
          /qmk_firmware/*.uf2
