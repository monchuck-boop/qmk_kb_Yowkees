name: Build QMK Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli:latest  # 最新のQMK公式コンテナ環境
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: main  # info.jsonが存在する「main」ブランチから直接ソースコードをダウンロードします

    - name: Force Deploy and Compile Keyball61 (RP2040)
      run: |
        # QMK公式の環境セットアップ（外部URL通信なし）
        qmk setup -y
        
        # QMK側のキーボードディレクトリを強制展開
        mkdir -p /qmk_firmware/keyboards/keyball/keyball61
        
        # mainブランチから読み込んだプログラム一式（info.jsonなど）をQMKに確実に流し込みます
        cp -R keyball61/. /qmk_firmware/keyboards/keyball/keyball61/
        
        # フォルダが完璧に配置され、info.jsonが存在するかをログで証明します
        echo "=== コピー完了後のQMK内部のファイル一覧 ==="
        ls -la /qmk_firmware/keyboards/keyball/keyball61/
        
        # ProMicro RP2040用に完璧なビルドコマンドを実行
        cd /qmk_firmware
        qmk compile -kb keyball/keyball61 -km default -e MCU=RP2040 -e BOOTLOADER=rp2040

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Keyball61_RP2040_Firmware
        path: |
          /qmk_firmware/*.uf2
          /qmk_firmware/*.bin
          /qmk_firmware/.build/*.uf2
          /qmk_firmware/.build/*.bin
