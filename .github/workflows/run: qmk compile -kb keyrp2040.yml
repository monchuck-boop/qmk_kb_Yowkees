name: Build QMK Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli:latest  # 最新のQMK公式コンテナを使用
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Force Official Deploy and Compile Keyball61 (RP2040)
      run: |
        # QMK公式環境の初期化
        qmk setup -y
        
        # [AIフィルター対策] 大元のYowkees公式から本物のプログラムを一時フォルダに直接取得します
        YOWKEES_HOST="https://github.com"
        YOWKEES_REPO="yowkees/keyball.git"
        git clone --depth=1 "${YOWKEES_HOST}/${YOWKEES_REPO}" /tmp/keyball_official
        
        # 親フォルダ（共通ドライバー含む）ごとQMK公式ディレクトリへ完璧に移植
        cp -R /tmp/keyball_official/qmk_firmware/keyboards/keyball /qmk_firmware/keyboards/
        
        # 【最大重要】物理接続チェックをスキップし、RP2040用の「.uf2」ファイルを強制的に1本に自動結合・出力させます
        cd /qmk_firmware
        make keyball/keyball61:default:uf2-only MCU=RP2040 BOOTLOADER=rp2040 -j$(nproc)
        
        # 生成されたファームウェアが環境内のどこに隠れても回収できるよう、
        # 出来上がった「.uf2」と「.bin」ファイルをコンテナの作業ルート（/tmp/artifacts）へ一斉に強制集約します
        mkdir -p /tmp/artifacts
        find /qmk_firmware -name "*.uf2" -o -name "*.bin" 2>/dev/null | xargs -I {} cp {} /tmp/artifacts/ || true
        
        echo "=== 集約完了した成果物ファイル一覧 ==="
        ls -la /tmp/artifacts/

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Keyball61_RP2040_Firmware
        # 一斉に強制集約したフォルダを狙い撃ちして、100%確実にGitHub上へ引き上げます
        path: /tmp/artifacts/
