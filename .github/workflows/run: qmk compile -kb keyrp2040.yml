name: Build QMK Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli:latest
    steps:
    - name: Checkout repository from main branch
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Force Smart Deploy and Compile Keyball61 (RP2040)
      run: |
        # QMK公式環境の初期化
        qmk setup -y
        
        # QMK公式が100%認識できる標準構造（keyboards/keyball/keyball61）を強制展開
        mkdir -p /qmk_firmware/keyboards/keyball/keyball61
        
        # あなたのリポジトリの「main」ブランチ内にある本物のKeyball61ソースを流し込みます
        # パスがズレていても確実に届くよう、想定される2つの場所からまとめて上書きコピーします
        if [ -d "keyball/keyball61" ]; then
          cp -R keyball/keyball61/. /qmk_firmware/keyboards/keyball/keyball61/
        elif [ -d "keyball61" ]; then
          cp -R keyball61/. /qmk_firmware/keyboards/keyball/keyball61/
        fi
        
        # 配置完了後にファイルが本当に入ったかをログで物理的に証明します
        echo "=== コピー完了後のQMK内部のファイル一覧 ==="
        ls -la /qmk_firmware/keyboards/keyball/keyball61/
        
        # QMK CLIツールのバグを回避するため、内部のmakeシステムを直接実行してコンパイルさせます
        cd /qmk_firmware
        make keyball/keyball61:default MCU=RP2040 BOOTLOADER=rp2040

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Keyball61_RP2040_Firmware
        path: |
          /qmk_firmware/.build/*.uf2
          /qmk_firmware/.build/*.bin
          /qmk_firmware/*.uf2
