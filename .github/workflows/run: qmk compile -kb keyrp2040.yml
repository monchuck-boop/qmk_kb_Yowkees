name: Build QMK Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli:latest  # 最新のQMK公式コンテナを使用
    steps:
    - name: Checkout repository from main branch
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Force Smart Deploy and Compile Keyball61 (RP2040)
      run: |
        # QMK公式環境の初期化
        qmk setup -y
        
        # 確実にプログラムが存在するフォルダを特定します
        REAL_PATH=$(find . -type f -name "info.json" | grep "keyball61" | head -n 1 | xargs dirname)
        if [ -z "$REAL_PATH" ]; then
          REAL_PATH=$(find . -type f -name "info.json" | head -n 1 | xargs dirname)
        fi
        
        # QMK公式の keyboards フォルダの配下に直接上書きコピーします
        mkdir -p /qmk_firmware/keyboards/keyball/keyball61
        cp -R ${REAL_PATH}/. /qmk_firmware/keyboards/keyball/keyball61/
        
        # 【最重要】QMK CLIの認識バグを回避するため、エラーを出すツールを使わず、内部のmakeシステムを直接実行します
        cd /qmk_firmware
        make keyball/keyball61:default MCU=RP2040 BOOTLOADER=rp2040

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Keyball61_RP2040_Firmware
        path: |
          /qmk_firmware/*.uf2
          /qmk_firmware/*.bin
          /qmk_firmware/.build/*.uf2
          /qmk_firmware/.build/*.bin
