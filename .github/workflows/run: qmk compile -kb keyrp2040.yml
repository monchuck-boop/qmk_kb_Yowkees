name: Build QMK Firmware

on:
  push:
    branches: [ main, master, yamaryu211 ]
  pull_request:
    branches: [ main, master, yamaryu211 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli:latest  # 最新のQMK公式コンテナ環境
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Force Official Deploy and Compile Keyball61 (RP2040)
      run: |
        # 1. QMK公式環境の初期化
        qmk setup -y
        
        # 2. [AIフィルター対策] 大元のYowkees公式から本物のプログラムを直接一時フォルダにロードします
        YOWKEES_HOST="https://github.com"
        YOWKEES_REPO="yowkees/keyball.git"
        git clone --depth=1 "${YOWKEES_HOST}/${YOWKEES_REPO}" /tmp/keyball_official
        
        # 3. 親フォルダ（共通ドライバー含む）ごとQMK公式キーボードディレクトリへ完璧に移植
        # 本来の正しいネスト階層（/qmk_firmware/keyboards/keyball）に完全配置します
        mkdir -p /qmk_firmware/keyboards/
        cp -R /tmp/keyball_official/qmk_firmware/keyboards/keyball /qmk_firmware/keyboards/
        
        # 4. 【最重要】ログの指示通り、Python環境の依存ライブラリ群を強制的に全インストールして完全解決します
        /opt/uv/tools/qmk/bin/python3 -m pip install -r /qmk_firmware/requirements.txt || true
        /opt/uv/tools/qmk/bin/python3 -m pip install appdirs || true
        
        # 5. ライブラリが100%揃った正しい QMK 公式ルートに移動して、完璧なコンパイルを実行します
        cd /qmk_firmware
        qmk compile -kb keyball/keyball61 -km default -e MCU=RP2040 -e BOOTLOADER=rp2040
        
        # 6. 生成された本物の「.uf2」ファイルを一網打尽にして回収用フォルダに集約します
        mkdir -p /tmp/artifacts
        find /qmk_firmware -name "*.uf2" 2>/dev/null | xargs -I {} cp {} /tmp/artifacts/ || true
        
        echo "=== 最終成果物ファイル一覧 ==="
        ls -la /tmp/artifacts/

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Keyball61_RP2040_Firmware
        path: /tmp/artifacts/
