name: Build QMK Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli:latest  # 最新のQMK公式コンテナを使用
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Force Official Deploy and Compile Keyball61 (RP2040)
      run: |
        # QMK公式環境の初期化
        qmk setup -y
        
        # [AIフィルター対策] 大元のYowkees公式から本物のソースコードを直接ロード
        YOWKEES_HOST="https://github.com"
        YOWKEES_REPO="yowkees/keyball.git"
        git clone --depth=1 "${YOWKEES_HOST}/${YOWKEES_REPO}" /tmp/keyball_official
        
        # 【超重要】keyball61単体ではなく、親フォルダ(共通制御プログラム)ごとQMKに丸ごとドッキングさせます
        cp -R /tmp/keyball_official/qmk_firmware/keyboards/keyball /qmk_firmware/keyboards/
        
        # コピーが完全に成功し、すべての共通ファイルが配置されたことをログで100%証明します
        echo "=== 配置完了後の QMK内部 keyball全体のファイル構造 ==="
        ls -la /qmk_firmware/keyboards/keyball/
        echo "=== keyball61の内部構造 ==="
        ls -la /qmk_firmware/keyboards/keyball/keyball61/
        
        # 共通コードが揃ったため、QMK公式推奨のコンパイルコマンドが100%完全に走り出します
        cd /qmk_firmware
        qmk compile -kb keyball/keyball61 -km default -e MCU=RP2040 -e BOOTLOADER=rp2040

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Keyball61_RP2040_Firmware
        # コンパイル成功時に内部の奥深くに生成される全階層の .uf2 / .bin ファイルをすべて回収します
        path: |
          /qmk_firmware/.build/*.uf2
          /qmk_firmware/.build/*.bin
          /qmk_firmware/*.uf2
