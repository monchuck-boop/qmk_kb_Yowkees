name: Build QMK Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli:latest  # QMK公式の最新ビルド環境を使用
    steps:
    - name: Checkout repository from main branch
      uses: actions/checkout@v4
      with:
        ref: main  # キャッシュを無視して、確実にinfo.jsonが存在する「main」ブランチを絶対指定で取得します

    - name: Force Overwrite and Compile Keyball61 (RP2040)
      run: |
        # QMK公式の環境を確実に初期化
        qmk setup -y
        
        # QMKの keyboards 配下に直接 keyball ディレクトリを作成
        mkdir -p /qmk_firmware/keyboards/keyball
        
        # mainブランチから読み込んだ本物のプログラム構造（keyballフォルダ）を、
        # QMKの keyboards/ 直下へ完全に重なるように丸ごと強制コピーします
        cp -R keyball/* /qmk_firmware/keyboards/keyball/
        
        # コピーが完全に成功し、info.jsonが配置されたことをログで証明します
        echo "=== 配置完了後の QMK内部 keyball61 の本当のファイル構造 ==="
        ls -la /qmk_firmware/keyboards/keyball/keyball61/
        
        # ProMicro RP2040用に完璧なビルドを実行します
        cd /qmk_firmware
        qmk compile -kb keyball/keyball61 -km default -e MCU=RP2040 -e BOOTLOADER=rp2040

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Keyball61_RP2040_Firmware
        path: |
          /qmk_firmware/*.uf2
          /qmk_firmware/*.bin
          /qmk_firmware/.build/*.uf2
          /qmk_firmware/.build/*.bin
