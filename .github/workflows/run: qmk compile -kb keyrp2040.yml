name: Build QMK Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli:latest  # 最新の完璧なQMK公式ビルド環境を直接使用します
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Compile Keyball61 (RP2040)
      run: |
        # QMK公式の最新ソースコードをコンテナ内に確実にセットアップします
        qmk setup -y
        
        # あなたのリポジトリにある keyball61 フォルダを、QMKの正しい位置に『中身だけ』展開します
        # フォルダの重複を防ぐため、宛先のフォルダを作ってから「/.」指定で中身だけをコピーします
        mkdir -p /qmk_firmware/keyboards/keyball/keyball61
        cp -R keyball61/. /qmk_firmware/keyboards/keyball/keyball61/
        
        # ProMicro RP2040用に完璧なビルドコマンドを実行します
        cd /qmk_firmware
        qmk compile -kb keyball/keyball61 -km default -e MCU=RP2040 -e BOOTLOADER=rp2040

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Keyball61_RP2040_Firmware
        path: |
          /qmk_firmware/*.uf2
          /qmk_firmware/*.bin
          /qmk_firmware/.build/*.uf2
          /qmk_firmware/.build/*.bin
