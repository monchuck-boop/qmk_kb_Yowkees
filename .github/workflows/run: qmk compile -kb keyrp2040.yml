name: Build QMK Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli:latest  # QMK公式の最新環境を使用
    steps:
    - name: Checkout repository from main branch
      uses: actions/checkout@v4
      with:
        ref: main  # 確実にinfo.jsonが存在する「main」ブランチを強制的に指定して取得します

    - name: Compile Keyball61 (RP2040)
      run: |
        # QMK公式環境をセットアップ
        qmk setup -y
        
        # QMK側に keyboards/keyball/keyball61 ディレクトリを作成します
        mkdir -p /qmk_firmware/keyboards/keyball/keyball61
        
        # mainブランチから取得した keyball61 フォルダの全ファイルを、QMK内の正しい位置へ確実にコピーします
        cp -R keyball61/. /qmk_firmware/keyboards/keyball/keyball61/
        
        # コピーが正しく行われたかログで確認します（info.json等が表示されます）
        echo "=== コピー後のQMK側フォルダ構造 ==="
        ls -la /qmk_firmware/keyboards/keyball/keyball61/
        
        # ProMicro RP2040用に完璧なビルドコマンドを実行します
        cd /qmk_firmware
        qmk compile -kb keyball/keyball61 -km default -e MCU=RP2040 -e BOOTLOADER=rp2040

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Keyball61_RP2040_Firmware
        path: |
          /qmk_firmware/*.uf2
          /qmk_firmware/*.bin
          /qmk_firmware/.build/*.uf2
          /qmk_firmware/.build/*.bin
