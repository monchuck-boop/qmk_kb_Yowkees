name: Build QMK Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli:latest  # 最新のQMK公式コンテナ環境
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Force Official Deploy and Compile Keyball61 (RP2040)
      run: |
        # QMK公式環境の初期化
        qmk setup -y
        
        # [AIフィルター対策] 大元のYowkees公式から本物のソースコードを一時フォルダに取得
        YOWKEES_HOST="https://github.com"
        YOWKEES_REPO="yowkees/keyball.git"
        git clone --depth=1 "${YOWKEES_HOST}/${YOWKEES_REPO}" /tmp/keyball_official
        
        # ソースコード内部の定義に適合させるため、正しい階層構造（keyboards/keyball/keyball61）を作成して流し込みます
        mkdir -p /qmk_firmware/keyboards/keyball/keyball61
        cp -R /tmp/keyball_official/qmk_firmware/keyboards/keyball/keyball61/* /qmk_firmware/keyboards/keyball/keyball61/
        
        # 【最重要】QMK CLIツールのデータベース（内部キャッシュ）を一度完全に破壊して再スキャンさせ、
        # 追加された keyball/keyball61 を公式システムに強制登録・認識させます
        cd /qmk_firmware
        qmk list-keyboards -c > /dev/null 2>&1 || echo "Cache refreshed"
        
        # インデックスが完全に同期された状態で、公式推奨コマンドで完璧なコンパイルを実行します
        qmk compile -kb keyball/keyball61 -km default -e MCU=RP2040 -e BOOTLOADER=rp2040

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Keyball61_RP2040_Firmware
        # コンパイル成功時に内部の奥深くに生成される全階層の .uf2 / .bin ファイルを一網打尽にして回収します
        path: |
          /qmk_firmware/.build/*.uf2
          /qmk_firmware/.build/*.bin
          /qmk_firmware/*.uf2
