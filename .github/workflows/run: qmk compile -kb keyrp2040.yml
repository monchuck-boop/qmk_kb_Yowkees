name: Build QMK Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli:latest  # QMK公式の最新ビルド環境を直接使用
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Compile Keyball61 (RP2040)
      run: |
        # QMK環境のセットアップ
        qmk setup -y
        
        # ターゲットフォルダの強制作成
        mkdir -p /qmk_firmware/keyboards/keyball/keyball61
        
        # フォルダ名が「keyball/keyball61」か「keyball61」のどちらであっても自動検知してコピーします
        if [ -d "keyball/keyball61" ]; then
          cp -R keyball/keyball61/. /qmk_firmware/keyboards/keyball/keyball61/
        elif [ -d "keyball61" ]; then
          cp -R keyball61/. /qmk_firmware/keyboards/keyball/keyball61/
        else
          # 万が一直下にソースファイルが散らばっている場合のフォールバック
          find . -maxdepth 1 -not -name '.' -not -name 'qmk_firmware' -not -name '.git' -not -name '.github' -exec cp -R {} /qmk_firmware/keyboards/keyball/keyball61/ \;
        fi
        
        # ProMicro RP2040用に完璧なビルドコマンドを実行
        cd /qmk_firmware
        qmk compile -kb keyball/keyball61 -km default -e MCU=RP2040 -e BOOTLOADER=rp2040

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Keyball61_RP2040_Firmware
        path: |
          /qmk_firmware/*.uf2
          /qmk_firmware/*.bin
          /qmk_firmware/.build/*.uf2
          /qmk_firmware/.build/*.bin
