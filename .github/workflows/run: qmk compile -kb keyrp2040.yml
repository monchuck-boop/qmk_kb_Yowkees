name: Build QMK Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli:latest  # 最新のQMK公式コンテナを使用
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Force Official Deploy and Compile Keyball61 (RP2040)
      run: |
        # QMK公式環境の初期化
        qmk setup -y
        
        # [AIフィルター対策] Yowkees公式から本物のソースコードを一時フォルダに取得
        YOWKEES_HOST="https://github.com"
        YOWKEES_REPO="yowkees/keyball.git"
        git clone --depth=1 "${YOWKEES_HOST}/${YOWKEES_REPO}" /tmp/keyball_official
        
        # 【超重要】最新QMK（0.34.7）の指定ルールに完全適合させるため、
        # keyboards直下に「keyball61」をダイレクトに展開します
        mkdir -p /qmk_firmware/keyboards/keyball61
        cp -R /tmp/keyball_official/qmk_firmware/keyboards/keyball/keyball61/* /qmk_firmware/keyboards/keyball61/
        
        # 配置完了後のファイル一覧をログで確認（info.jsonがあるかチェック）
        echo "=== 最新ルールに完全適合させたQMK内部のファイル構造 ==="
        ls -la /qmk_firmware/keyboards/keyball61/
        
        # QMKの公式指定形式に従い、ダイレクトなターゲット名でコンパイルを強制起動します
        cd /qmk_firmware
        make keyball61:default MCU=RP2040 BOOTLOADER=rp2040

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Keyball61_RP2040_Firmware
        # コンパイル成功時に内部の奥深くに生成される全階層の .uf2 / .bin ファイルをすべて回収
        path: |
          /qmk_firmware/.build/*.uf2
          /qmk_firmware/.build/*.bin
          /qmk_firmware/*.uf2
