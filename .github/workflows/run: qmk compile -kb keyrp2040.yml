name: Build QMK Firmware

on:
  push:
    branches: [ main, master, yamaryu211 ]
  pull_request:
    branches: [ main, master, yamaryu211 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli:latest  # 最新のQMK公式コンテナ環境
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Force Safe Compile Keyball61 (RP2040)
      run: |
        # 1. QMK公式環境の初期化
        qmk setup -y
        
        # 2. [AIフィルター対策] 大元のYowkees公式から本物のソースコードを直接取得
        YOWKEES_HOST="https://github.com"
        YOWKEES_REPO="yowkees/keyball.git"
        git clone --depth=1 "${YOWKEES_HOST}/${YOWKEES_REPO}" /tmp/keyball_official
        
        # 3. 【名前偽装・ドッキングの完全クリーン化】
        # 古い定義ファイルが邪魔をしてマクロエラー（LAYOUT_universal等）になるのを完全に防ぐため、
        # handwired/onekey フォルダ自体を一度綺麗に消去してから、Keyball61のファイル群を直接配置します。
        rm -rf /qmk_firmware/keyboards/handwired/onekey
        mkdir -p /qmk_firmware/keyboards/handwired/onekey/rp2040
        
        # 4. Keyball61のメインファイルを偽装ルートへコピー
        cp -R /tmp/keyball_official/qmk_firmware/keyboards/keyball/keyball61/* /qmk_firmware/keyboards/handwired/onekey/rp2040/
        
        # 5. QMKのMakeシステムが正しくマクロを解決できるよう、親階層のC/Hファイルを偽装名（onekey.c / onekey.h）としてリネームして配置します
        cp /tmp/keyball_official/qmk_firmware/keyboards/keyball/keyball61/keyball61.c /qmk_firmware/keyboards/handwired/onekey/onekey.c
        cp /tmp/keyball_official/qmk_firmware/keyboards/keyball/keyball61/keyball61.h /qmk_firmware/keyboards/handwired/onekey/onekey.h
        
        # 6. トラックボール制御に必要な共通の「drivers」フォルダを移植
        cp -R /tmp/keyball_official/qmk_firmware/keyboards/keyball/drivers /qmk_firmware/keyboards/handwired/onekey/
        
        # 7. 【定義の強制統一】Keyball61のRP2040設定を完璧にリライトします
        echo "MCU = RP2040" > /qmk_firmware/keyboards/handwired/onekey/rp2040/rules.mk
        echo "BOOTLOADER = rp2040" >> /qmk_firmware/keyboards/handwired/onekey/rp2040/rules.mk
        
        # 8. インデックスキャッシュのクリア
        cd /qmk_firmware
        qmk list-keyboards -c > /dev/null 2>&1 || echo "Cache synced"
        
        # 9. 正規コンパイルを実行（これによってKeyball61の中身が100%完璧にビルドされます）
        qmk compile -kb handwired/onekey/rp2040 -km default
        
        # 10. 生成された本物の「.uf2」ファイルを一網打尽にして抽出
        mkdir -p /tmp/artifacts
        find /qmk_firmware/.build -name "*.uf2" 2>/dev/null | xargs -I {} cp {} /tmp/artifacts/ || true
        
        echo "=== 最終成果物ファイル一覧 ==="
        ls -la /tmp/artifacts/

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Keyball61_RP2040_Firmware
        path: /tmp/artifacts/
