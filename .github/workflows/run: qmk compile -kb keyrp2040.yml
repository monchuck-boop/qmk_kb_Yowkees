name: Build QMK Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install QMK CLI
      run: |
        python3 -m pip install --user qmk

    - name: Compile Keyball61 (RP2040)
      run: |
        # あなたのリポジトリに最初から入っている qmk_firmware フォルダに移動します
        cd qmk_firmware
        
        # リポジトリ内の独自構造に合わせてRP2040用ビルドを実行します
        qmk compile -kb keyball/keyball61 -km default -e MCU=RP2040 -e BOOTLOADER=rp2040

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Keyball61_RP2040_Firmware
        path: |
          qmk_firmware/*.uf2
          qmk_firmware/*.bin
