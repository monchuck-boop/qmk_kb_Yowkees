name: Build QMK Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Build Dependencies
      run: |
        # RP2040 (ARM) のコンパイルに必要なクロスコンパイラを直接インストールします
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi

    - name: Deploy Keyball61 Source into QMK
      run: |
        # qmk_firmwareのキーボードディレクトリ内に keyball61 フォルダを作成します
        mkdir -p qmk_firmware/keyboards/keyball61
        
        # リポジトリのルートにある keyball61 フォルダの中身を、QMK内の正しい位置へ確実にコピーします
        cp -R keyball61/. qmk_firmware/keyboards/keyball61/

    - name: Compile Keyball61 (RP2040)
      run: |
        cd qmk_firmware
        # 配置が正しく完了したため、同梱のQMKシステム上でビルドが正常に開始されます
        make keyball61:default MCU=RP2040 BOOTLOADER=rp2040

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Keyball61_RP2040_Firmware
        path: |
          qmk_firmware/*.uf2
          qmk_firmware/*.bin
