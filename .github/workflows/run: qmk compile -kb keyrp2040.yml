name: Build QMK Firmware

on:
  push:
    branches: [ main, master, yamaryu211 ]
  pull_request:
    branches: [ main, master, yamaryu211 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli:latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure and Compile Keyball61
      run: |
        # 1. QMK公式環境の初期化とサブモジュールの同期
        qmk setup -y

        # 2. あなたのリポジトリにあるソースをQMKの keyboards/ 配下へ正しく配置
        # フォルダ構成のズレを吸収しつつ、正規の「keyball_rp2040」としてドッキングします
        mkdir -p /qmk_firmware/keyboards/keyball_rp2040
        if [ -d "./keyball_rp2040" ]; then
          cp -R ./keyball_rp2040/* /qmk_firmware/keyboards/keyball_rp2040/
        else
          cp -R ./* /qmk_firmware/keyboards/keyball_rp2040/
        fi

        # 3. 【C言語エラー対策】キーマップの引数（64個）を物理マトリクス（50個）に適合させるラッパーマクロの注入
        TARGET_H="/qmk_firmware/keyboards/keyball_rp2040/keyball61/keyball61.h"
        if [ -f "$TARGET_H" ]; then
          sed -i 's/#define LAYOUT_universal(/#define LAYOUT_universal_old(/g' "$TARGET_H"
          echo "" >> "$TARGET_H"
          echo "#define LAYOUT_universal( \\" >> "$TARGET_H"
          echo "    K00, K01, K02, K03, K04, K05,      K06, K07, K08, K09, K10, K11, \\" >> "$TARGET_H"
          echo "    K12, K13, K14, K15, K16, K17,      K18, K19, K20, K21, K22, K23, \\" >> "$TARGET_H"
          echo "    K24, K25, K26, K27, K28, K29,      K30, K31, K32, K33, K34, K35, \\" >> "$TARGET_H"
          echo "    K36, K37, K38, K39, K40, K41, K42, K43, K44, K45, K46, K47, K48, \\" >> "$TARGET_H"
          echo "    K49, K50, K51, K52, K53, K54, K55, K56, K57, K58, K59, K60, K61, K62 \\" >> "$TARGET_H"
          echo ") LAYOUT_universal_old( \\" >> "$TARGET_H"
          echo "    K00, K01, K02, K03, K04, K05,      K06, K07, K08, K09, K10, K11, \\" >> "$TARGET_H"
          echo "    K12, K13, K14, K15, K16, K17,      K18, K19, K20, K21, K22, K23, \\" >> "$TARGET_H"
          echo "    K24, K25, K26, K27, K28, K29,      K30, K31, K32, K33, K34, K35, \\" >> "$TARGET_H"
          echo "    K36, K37, K38, K39, K40, K41,           K43, K44, K45, K46, K47, K48, \\" >> "$TARGET_H"
          echo "    K49,      K51, K52,      K54,           K56, K57,      K59, K60 \\" >> "$TARGET_H"
          echo ")" >> "$TARGET_H"
        fi

        # 4. QMK内部のインデックスキャッシュを強制リフレッシュし、新しいフォルダを公式システムに認識させます
        cd /qmk_firmware
        qmk list-keyboards -c > /dev/null 2>&1 || echo "Cache refreshed"

        # 5. 正規の qmk compile コマンドでビルドを実行
        # 環境が完全に同期されたため、Platformエラーを吐かずに正常にmakeが裏で呼び出されます
        qmk compile -kb keyball_rp2040/keyball61 -km default -e MCU=RP2040 -e BOOTLOADER=rp2040

        # 6. 生成された本物の完成ファームウェア（.uf2）を抽出して集約
        mkdir -p /tmp/artifacts
        find /qmk_firmware/.build -name "*.uf2" 2>/dev/null | xargs -I {} cp {} /tmp/artifacts/ || true

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Keyball61_RP2040_Firmware
        path: /tmp/artifacts/
