name: Build QMK Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli:latest  # QMK公式の最新ビルド環境（コンテナ）を直接使用します
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Compile Keyball61 (RP2040)
      run: |
        # QMK公式の最新ソースコードをコンテナ内に強制的にセットアップします（URL不要）
        qmk setup -y
        
        # あなたのリポジトリの keyball61 フォルダを、QMKの正しい位置にドッキングします
        mkdir -p /qmk_firmware/keyboards/keyball
        cp -R keyball61 /qmk_firmware/keyboards/keyball/
        
        # ProMicro RP2040用に完璧なビルドコマンドを実行します
        cd /qmk_firmware
        qmk compile -kb keyball/keyball61 -km default -e MCU=RP2040 -e BOOTLOADER=rp2040

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Keyball61_RP2040_Firmware
        path: |
          /qmk_firmware/*.uf2
          /qmk_firmware/*.bin
          /qmk_firmware/.build/*.uf2
          /qmk_firmware/.build/*.bin
