name: Build QMK Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install QMK CLI
      run: |
        python3 -m pip install --user qmk

    - name: Clone official QMK Firmware
      run: |
        QMK_URL_HOST="https://github.com"
        QMK_URL_PATH="qmk/qmk_firmware.git"
        git clone --depth=1 --recursive "${QMK_URL_HOST}/${QMK_URL_PATH}" /home/runner/qmk_firmware

    - name: Deploy Keyball Source to QMK
      run: |
        # QMK側の keyboards/keyball ディレクトリを綺麗に作成します
        mkdir -p /home/runner/qmk_firmware/keyboards/keyball
        
        # あなたのリポジトリにある keyball61 などのフォルダを、QMKの keyboards/keyball/ の中へ正確に配置します
        if [ -d "keyball61" ]; then
          cp -R keyball61 /home/runner/qmk_firmware/keyboards/keyball/
        else
          # 万が一ルート直下がソースコードだった場合のフォールバック
          mkdir -p /home/runner/qmk_firmware/keyboards/keyball/keyball61
          cp -R * /home/runner/qmk_firmware/keyboards/keyball/keyball61/
        fi

    - name: Compile Keyball61 (RP2040)
      run: |
        cd /home/runner/qmk_firmware
        # QMKが正しく認識できるキーボード指定に戻してビルドします
        qmk compile -kb keyball/keyball61 -km default -e MCU=RP2040 -e BOOTLOADER=rp2040

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Keyball61_RP2040_Firmware
        path: |
          /home/runner/qmk_firmware/*.uf2
          /home/runner/qmk_firmware/*.bin
