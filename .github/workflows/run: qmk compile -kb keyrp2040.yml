name: Build QMK Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install QMK CLI
      run: |
        python3 -m pip install --user qmk

    - name: Clone official QMK Firmware
      run: |
        QMK_URL_HOST="https://github.com"
        QMK_URL_PATH="qmk/qmk_firmware.git"
        git clone --depth=1 --recursive "${QMK_URL_HOST}/${QMK_URL_PATH}" /home/runner/qmk_firmware

    - name: Deploy Keyball Source to QMK
      run: |
        # QMK公式の keyboards 直下に keyball61 フォルダとして直接配置します
        mkdir -p /home/runner/qmk_firmware/keyboards/keyball61
        
        if [ -d "keyboards/keyball/keyball61" ]; then
          cp -R keyboards/keyball/keyball61/* /home/runner/qmk_firmware/keyboards/keyball61/
        elif [ -d "keyball61" ]; then
          cp -R keyball61/* /home/runner/qmk_firmware/keyboards/keyball61/
        else
          cp -R * /home/runner/qmk_firmware/keyboards/keyball61/
        fi

    - name: Compile Keyball61 (RP2040)
      run: |
        cd /home/runner/qmk_firmware
        # キーボード名を keyball61 に変更してビルドを実行します
        qmk compile -kb keyball61 -km default -e MCU=RP2040 -e BOOTLOADER=rp2040

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Keyball61_RP2040_Firmware
        path: |
          /home/runner/qmk_firmware/*.uf2
          /home/runner/qmk_firmware/*.bin
